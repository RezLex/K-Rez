<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100">
  <defs>
    <linearGradient id="tileGradF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1c20"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>

    <filter id="frostBlurF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <filter id="frostBlurThinF" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <filter id="glintF" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="tileClipF">
      <rect x="4" y="4" width="92" height="92" rx="20"/>
    </clipPath>

    <mask id="plateMaskF">
