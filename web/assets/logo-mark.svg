<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1c20"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>

    <filter id="frostBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <filter id="frostBlurThin" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <!-- Sombra que cada fragmento tira hacia la hendidura: más ancha y más
         blureada que el bisel brillante, para leerse como la cara en
         penumbra del corte (el "canto" del vidrio), no como otro brillo. -->
    <filter id="shadowBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>

    <filter id="glint" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="tileClip">
      <rect x="4" y="4" width="92" height="92" rx="20"/>
    </clipPath>

    <!-- El logo son 4 fragmentos de vidrio separados por 4 cortes rectos que
         nacen de un punto de impacto central (38,50), inclinados con
         skewX — el espacio entre los fragmentos (no un hueco recortado en
         una sola placa) es lo que dibuja la K. Cada wedgeClip es una de
         esas 4 cuñas angulares alrededor del vértice, con sus dos bordes
         internos corridos hacia adentro (mismo offset perpendicular que
         usan luego el bisel y la sombra) para que quede un margen real
         entre fragmentos vecinos. Cada polígono se extiende muy por fuera
         del tile (los brazos "far*") solo para que, al intersecar con
         tileClip vía clip-path anidado, quede la porción correcta del tile
         en esa cuña — esos tramos lejanos nunca se ven. -->
    <clipPath id="wedgeClip1">
      <g transform="skewX(-16)">
        <path d="M40.74 43.88 L27.705 -255.84 L268.68 -150.98 L40.61 43.83 Z"/>
      </g>
    </clipPath>
    <clipPath id="wedgeClip2">
      <g transform="skewX(-16)">
        <path d="M44.51 48.39 L272.58 -146.42 L277.08 240.95 L44.545 51.464 Z"/>
      </g>
    </clipPath>
    <clipPath id="wedgeClip3">
      <g transform="skewX(-16)">
        <path d="M40.755 56.116 L273.29 245.6 L84.25 352.51 L41.82 55.52 Z"/>
      </g>
    </clipPath>
    <clipPath id="wedgeClip4">
      <g transform="skewX(-16)">
        <path d="M35.88 56.36 L78.31 353.35 L-262 50 L21.705 -255.58 L34.74 44.14 Z"/>
      </g>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <!-- Los 4 fragmentos: mismo vidrio (mismo gradiente), cada uno recortado
         a su propia cuña. No hay una placa entera con un agujero: si un
         fragmento faltara, se notaría un vacío con la forma de esa cuña,
         no "un pedazo de la K". -->
    <g clip-path="url(#wedgeClip1)"><rect x="4" y="4" width="92" height="92" rx="20" fill="url(#tileGrad)"/></g>
    <g clip-path="url(#wedgeClip2)"><rect x="4" y="4" width="92" height="92" rx="20" fill="url(#tileGrad)"/></g>
    <g clip-path="url(#wedgeClip3)"><rect x="4" y="4" width="92" height="92" rx="20" fill="url(#tileGrad)"/></g>
    <g clip-path="url(#wedgeClip4)"><rect x="4" y="4" width="92" height="92" rx="20" fill="url(#tileGrad)"/></g>

    <!-- Sombra de canto: cada fragmento la tira hacia la hendidura, un poco
         más adentro que el bisel brillante (mismo offset perpendicular,
         mayor magnitud) — sugiere que el corte tiene espesor y ese costado
         está en penumbra, no es solo un canal parejo. Va debajo del bisel
         brillante. -->
    <g transform="skewX(-16)" stroke="#05070a" stroke-opacity="0.4" stroke-width="2.2" fill="none" stroke-linecap="butt" filter="url(#shadowBlur)">
      <path d="M43.24 43.77 L41.79 10.66"/>
      <path d="M32.24 44.25 L30.81 11.14"/>
      <path d="M33.41 56.71 L37.66 86.48"/>
      <path d="M44.3 55.17 L48.55 84.92"/>
      <path d="M46.13 50.29 L82.37 19.33"/>
      <path d="M38.99 41.93 L75.23 10.97"/>
      <path d="M39.18 58.05 L80.43 91.66"/>
      <path d="M46.12 49.53 L87.37 83.14"/>
      <circle cx="38" cy="50" r="6.2"/>
    </g>

    <!-- Bisel esmerilado: nace de los contornos de cada fragmento (su borde
         exterior y los dos filos que lo separan de sus vecinos), nunca del
         medio del hueco. Cada filo arranca recortado a cierta distancia
         del vértice (ahí los 8 filos —2 por corte× 4 cortes— convergerían
         y se cruzarían) y ese hueco se cierra con un único aro circular en
         el punto de impacto. -->
    <g fill="none" stroke="#ffffff">
      <rect x="4" y="4" width="92" height="92" rx="20" stroke-width="3" stroke-opacity="0.3" filter="url(#frostBlur)"/>
      <rect x="4" y="4" width="92" height="92" rx="20" stroke-width="1" stroke-opacity="0.55"/>
      <g transform="skewX(-16)" stroke-linecap="butt">
        <g filter="url(#frostBlurThin)" stroke-width="1.6" stroke-opacity="0.3">
          <path d="M40.74 43.88 L39.297 10.77"/>
          <path d="M34.74 44.14 L33.303 11.03"/>
          <path d="M35.88 56.36 L40.13 86.124"/>
          <path d="M41.82 55.52 L46.07 85.276"/>
          <path d="M44.51 48.39 L80.747 17.43"/>
          <path d="M40.61 43.83 L76.853 12.87"/>
          <path d="M40.755 56.116 L82.005 89.726"/>
          <path d="M44.545 51.464 L85.795 85.074"/>
          <circle cx="38" cy="50" r="4"/>
        </g>
        <g stroke-width="0.7" stroke-opacity="0.55">
          <path d="M40.74 43.88 L39.297 10.77"/>
          <path d="M34.74 44.14 L33.303 11.03"/>
          <path d="M35.88 56.36 L40.13 86.124"/>
          <path d="M41.82 55.52 L46.07 85.276"/>
          <path d="M44.51 48.39 L80.747 17.43"/>
          <path d="M40.61 43.83 L76.853 12.87"/>
          <path d="M40.755 56.116 L82.005 89.726"/>
          <path d="M44.545 51.464 L85.795 85.074"/>
          <circle cx="38" cy="50" r="4"/>
        </g>
      </g>
    </g>

    <!-- Destellos: sobre esos mismos contornos (borde de la placa, punto de
         impacto y puntas de la K), parpadeo asincrónico tipo bola de disco. -->
    <g fill="#ffffff" filter="url(#glint)">
      <circle cx="50" cy="4" r="1.6">
        <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.3s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="96" cy="50" r="1.6">
        <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="50" cy="96" r="1.6">
        <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.1s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="4" cy="50" r="1.6">
        <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.8s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <g transform="skewX(-16)">
        <circle cx="38" cy="50" r="2">
          <animate attributeName="opacity" values="0;1;0.2;0" keyTimes="0;0.15;0.45;1" dur="1.9s" begin="0.3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="36.3" cy="10.9" r="1.5">
          <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
        </circle>
        <circle cx="43.1" cy="85.7" r="1.5">
          <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="78.8" cy="15.15" r="1.5">
          <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="83.9" cy="87.4" r="1.5">
          <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.0s" begin="1.8s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>
</svg>
