<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1c20"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>

    <!-- Franja de luz que "fluye" por dentro de la grieta: variación acotada
         alrededor del azul de marca (accent #4da3ff), no un barrido a
         blanco — un matiz apenas más oscuro y otro apenas más claro,
         repetidos infinito (spreadMethod=repeat) y trasladados con
         animateTransform. -->
    <linearGradient id="flowGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="70" spreadMethod="repeat">
      <stop offset="0" stop-color="#3d84d6"/>
      <stop offset="0.5" stop-color="#7ec8ff"/>
      <stop offset="1" stop-color="#3d84d6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="0 -70" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="crackBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- La "K" es la grieta de un vidrio roto: 4 cortes rectos (sin
         quiebres, sin zig-zag) que nacen de un punto de impacto central
         (38,50), inclinados con skewX. Dos máscaras del mismo trazo: una
         gruesa + blureada (halo que se filtra al vidrio de alrededor) y una
         fina y nítida (el núcleo de la grieta). -->
    <mask id="maskGlow">
      <rect x="0" y="0" width="100" height="100" fill="black"/>
      <g transform="skewX(-16)">
        <path
          d="M38 50 L36 4 M38 50 L44 92 M38 50 L86 9 M38 50 L92 94"
          fill="none" stroke="white" stroke-width="14" stroke-linecap="round" filter="url(#crackBlur)"
        />
      </g>
    </mask>
    <mask id="maskSharp">
      <rect x="0" y="0" width="100" height="100" fill="black"/>
      <g transform="skewX(-16)">
        <path
          d="M38 50 L36 4 M38 50 L44 92 M38 50 L86 9 M38 50 L92 94"
          fill="none" stroke="white" stroke-width="4" stroke-linecap="round"
        />
      </g>
    </mask>

    <clipPath id="tileClip">
      <rect x="4" y="4" width="92" height="92" rx="20"/>
    </clipPath>
  </defs>

  <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#tileGrad)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <g clip-path="url(#tileClip)">
    <rect x="0" y="0" width="100" height="100" fill="url(#flowGrad)" mask="url(#maskGlow)" opacity="0.3"/>
    <rect x="0" y="0" width="100" height="100" fill="url(#flowGrad)" mask="url(#maskSharp)"/>
  </g>
</svg>
