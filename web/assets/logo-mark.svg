<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1c20"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>

    <filter id="frostBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <!-- Bloom de los destellos: blur + la forma nítida encima, para que el
         punto tenga un núcleo brillante con halo, no un círculo plano. -->
    <filter id="glint" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="tileClip">
      <rect x="4" y="4" width="92" height="92" rx="20"/>
    </clipPath>

    <!-- La "K" es la grieta de un vidrio roto: 4 cortes rectos desde un
         punto de impacto central (38,50), inclinados con skewX. Las puntas
         se extienden a propósito más allá del viewBox — tileClip las corta
         justo en el borde redondeado del tile, así la grieta "sale" por el
         borde en vez de quedar flotando adentro con una punta suelta.
         stroke-linecap="butt": cortes planos, no puntas redondeadas. -->
    <mask id="plateMask">
      <rect x="4" y="4" width="92" height="92" rx="20" fill="white"/>
      <g transform="skewX(-16)">
        <path
          d="M35.2 -14.4 L38 50 M38 50 L46.4 108.8 M38 50 L105.2 -7.4 M38 50 L113.6 111.6"
          fill="none" stroke="black" stroke-width="7" stroke-linecap="butt"
        />
      </g>
    </mask>
  </defs>

  <g clip-path="url(#tileClip)">
    <!-- Placa de vidrio: la K es un agujero transparente recortado con
         plateMask, sin relleno ni efecto propio — el agujero en sí no
         "hace" nada, es la ausencia de placa. -->
    <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#tileGrad)" mask="url(#plateMask)"/>

    <!-- Esmerilado: mismo tratamiento (halo blureado + trazo nítido) para el
         borde exterior de la placa y para los DOS filos de la K recortada
         — la grieta es un hueco (7 de ancho), no una línea rellena, así que
         cada corte lleva un par de trazos paralelos pegados a sus bordes
         (offset perpendicular a cada rayo) dejando el centro del hueco
         realmente transparente, en vez de un único trazo centrado que lo
         taparía por completo. -->
    <g>
      <rect x="4" y="4" width="92" height="92" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3" filter="url(#frostBlur)"/>
      <rect x="4" y="4" width="92" height="92" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
      <g transform="skewX(-16)" fill="none" stroke-linecap="butt">
        <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.6" filter="url(#frostBlur)">
          <path d="M40.997 49.87 L38.197 -14.53"/>
          <path d="M35.003 50.13 L32.203 -14.27"/>
          <path d="M35.03 50.424 L43.43 109.224"/>
          <path d="M40.97 49.576 L49.37 108.376"/>
          <path d="M39.947 52.28 L107.147 -5.12"/>
          <path d="M36.053 47.72 L103.253 -9.68"/>
          <path d="M36.105 52.326 L111.705 113.926"/>
          <path d="M39.895 47.674 L115.495 109.274"/>
        </g>
        <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.7">
          <path d="M40.997 49.87 L38.197 -14.53"/>
          <path d="M35.003 50.13 L32.203 -14.27"/>
          <path d="M35.03 50.424 L43.43 109.224"/>
          <path d="M40.97 49.576 L49.37 108.376"/>
          <path d="M39.947 52.28 L107.147 -5.12"/>
          <path d="M36.053 47.72 L103.253 -9.68"/>
          <path d="M36.105 52.326 L111.705 113.926"/>
          <path d="M39.895 47.674 L115.495 109.274"/>
        </g>
      </g>
    </g>

    <!-- Destellos: viven sobre los contornos (borde de la placa + bordes de
         la K), nunca sueltos en medio del vidrio — parpadeo asincrónico
         tipo bola de disco, cada uno con su propio dur/begin. -->
    <g fill="#ffffff" filter="url(#glint)">
      <circle cx="50" cy="4" r="1.6">
        <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.3s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="96" cy="50" r="1.6">
        <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="50" cy="96" r="1.6">
        <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.1s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="4" cy="50" r="1.6">
        <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.8s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <g transform="skewX(-16)">
        <circle cx="38" cy="50" r="2.4">
          <animate attributeName="opacity" values="0;1;0.2;0" keyTimes="0;0.15;0.45;1" dur="1.9s" begin="0.3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="36.3" cy="10.9" r="1.5">
          <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
        </circle>
        <circle cx="43.1" cy="85.7" r="1.5">
          <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="78.8" cy="15.15" r="1.5">
          <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="83.9" cy="87.4" r="1.5">
          <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.0s" begin="1.8s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>
</svg>
