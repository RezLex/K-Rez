<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- 4 gradientes, uno por fragmento, con un tinte apenas distinto cada
         uno (como facetas de un cristal real, cada una atrapando la luz un
         poco distinto) — si los 4 fragmentos compartieran exactamente el
         mismo gradiente, la pieza se lee como una sola placa continua con
         líneas encima en vez de 4 objetos separados. -->
    <linearGradient id="tileGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2126"/>
      <stop offset="1" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="tileGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181a1e"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="tileGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22252a"/>
      <stop offset="1" stop-color="#0e0f12"/>
    </linearGradient>
    <linearGradient id="tileGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171b"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </linearGradient>

    <filter id="frostBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <filter id="frostBlurThin" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <!-- Sombra que cada fragmento tira hacia la hendidura: más ancha y más
         blureada que el bisel brillante, para leerse como la cara en
         penumbra del corte (el "canto" del vidrio), no como otro brillo. -->
    <filter id="shadowBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>

    <filter id="glint" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="tileClip">
      <rect x="4" y="4" width="92" height="92" rx="20"/>
    </clipPath>

    <!-- El logo son 4 fragmentos de vidrio separados por 4 cortes rectos que
         nacen de un punto de impacto central (38,50), inclinados con
         skewX — el espacio entre los fragmentos (no un hueco recortado en
         una sola placa) es lo que dibuja la K. Cada wedgeClip es una de
         esas 4 cuñas angulares alrededor del vértice, con sus dos bordes
         internos corridos hacia adentro (offset perpendicular de 6, el
         mismo que usa el bisel más abajo) para que la separación entre
         fragmentos vecinos se note de verdad. La recta de cada borde sigue
         derecho hasta bien lejos del tile (los brazos "far*", a 300 de
         distancia) — no se corta a la altura de las puntas del bisel/
         destellos como sí hacen esos elementos decorativos — así la
         separación real (lo que se ve transparente) llega hasta el borde
         del tile, aunque el brillo del bisel se apague antes. -->
    <clipPath id="wedgeClip1">
      <g transform="skewX(-16)">
        <path d="M43.603 40.748 L30.572 -258.969 L269.059 -155.253 L40.946 39.592 Z"/>
      </g>
    </clipPath>
    <clipPath id="wedgeClip2">
      <g transform="skewX(-16)">
        <path d="M48.740 48.717 L276.852 -146.129 L281.338 240.536 L48.767 51.034 Z"/>
      </g>
    </clipPath>
    <clipPath id="wedgeClip3">
      <g transform="skewX(-16)">
        <path d="M41.187 60.336 L273.758 249.838 L87.639 355.046 L45.212 58.061 Z"/>
      </g>
    </clipPath>
    <clipPath id="wedgeClip4">
      <g transform="skewX(-16)">
        <path d="M33.333 59.758 L75.760 356.743 L-262 50 L18.584 -258.448 L31.615 41.269 Z"/>
      </g>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <!-- Los 4 fragmentos: cada uno con su propio gradiente, cada uno
         recortado a su propia cuña. No hay una placa entera con un
         agujero: si un fragmento faltara, se notaría un vacío con la
         forma de esa cuña, no "un pedazo de la K". -->
    <g clip-path="url(#wedgeClip1)"><rect x="4" y="4" width="92" height="92" rx="20" fill="url(#tileGrad1)"/></g>
    <g clip-path="url(#wedgeClip2)"><rect x="4" y="4" width="92" height="92" rx="20" fill="url(#tileGrad2)"/></g>
    <g clip-path="url(#wedgeClip3)"><rect x="4" y="4" width="92" height="92" rx="20" fill="url(#tileGrad3)"/></g>
    <g clip-path="url(#wedgeClip4)"><rect x="4" y="4" width="92" height="92" rx="20" fill="url(#tileGrad4)"/></g>

    <!-- Sombra de canto: cada fragmento la tira hacia la hendidura, más
         adentro que el bisel brillante (mismo offset perpendicular, mayor
         magnitud: 9.5 contra 6) — sugiere que el corte tiene espesor y ese
         costado está en penumbra. Llega casi hasta el borde del tile
         (0.92 del largo de cada rayo, contra 0.85 antes) para que la
         separación se note también cerca de las puntas, no solo en el
         medio — dejando apenas margen para que el blur se apague antes de
         tileClip. Va debajo del bisel brillante. -->
    <g transform="skewX(-16)" stroke="#05070a" stroke-opacity="0.4" stroke-width="2.4" fill="none" stroke-linecap="butt" filter="url(#shadowBlur)">
      <path d="M47.100 40.596 L45.651 7.267"/>
      <path d="M28.118 41.421 L26.669 8.093"/>
      <path d="M29.868 60.253 L34.115 89.984"/>
      <path d="M48.677 57.566 L52.925 87.296"/>
      <path d="M51.013 51.378 L88.330 19.504"/>
      <path d="M38.673 36.931 L75.990 5.056"/>
      <path d="M38.976 63.050 L81.679 97.845"/>
      <path d="M50.978 48.320 L93.681 83.115"/>
      <circle cx="38" cy="50" r="11"/>
    </g>

    <!-- Bisel esmerilado: nace de los contornos de cada fragmento (su borde
         exterior y los dos filos que lo separan de sus vecinos), nunca del
         medio de la hendidura. Cada filo arranca recortado a cierta
         distancia del vértice (ahí los 8 filos —2 por corte × 4 cortes—
         convergerían y se cruzarían) y ese hueco se cierra con un único
         aro circular en el punto de impacto. También llega casi hasta el
         borde del tile (0.92), no solo hasta la mitad del corte. -->
    <g fill="none" stroke="#ffffff">
      <rect x="4" y="4" width="92" height="92" rx="20" stroke-width="3" stroke-opacity="0.3" filter="url(#frostBlur)"/>
      <rect x="4" y="4" width="92" height="92" rx="20" stroke-width="1" stroke-opacity="0.55"/>
      <g transform="skewX(-16)" stroke-linecap="butt">
        <g filter="url(#frostBlurThin)" stroke-width="1.6" stroke-opacity="0.3">
          <path d="M43.603 40.748 L42.154 7.419"/>
          <path d="M31.615 41.269 L30.166 7.941"/>
          <path d="M33.333 59.758 L37.580 89.489"/>
          <path d="M45.212 58.061 L49.460 87.791"/>
          <path d="M48.740 48.717 L86.057 16.842"/>
          <path d="M40.946 39.592 L78.263 7.718"/>
          <path d="M41.187 60.336 L83.890 95.131"/>
          <path d="M48.767 51.034 L91.470 85.829"/>
          <circle cx="38" cy="50" r="7.8"/>
        </g>
        <g stroke-width="0.7" stroke-opacity="0.55">
          <path d="M43.603 40.748 L42.154 7.419"/>
          <path d="M31.615 41.269 L30.166 7.941"/>
          <path d="M33.333 59.758 L37.580 89.489"/>
          <path d="M45.212 58.061 L49.460 87.791"/>
          <path d="M48.740 48.717 L86.057 16.842"/>
          <path d="M40.946 39.592 L78.263 7.718"/>
          <path d="M41.187 60.336 L83.890 95.131"/>
          <path d="M48.767 51.034 L91.470 85.829"/>
          <circle cx="38" cy="50" r="7.8"/>
        </g>
      </g>
    </g>

    <!-- Destellos: sobre esos mismos contornos (borde de la placa, punto de
         impacto y puntas de la K), parpadeo asincrónico tipo bola de disco. -->
    <g fill="#ffffff" filter="url(#glint)">
      <circle cx="50" cy="4" r="1.6">
        <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.3s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="96" cy="50" r="1.6">
        <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="50" cy="96" r="1.6">
        <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.1s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="4" cy="50" r="1.6">
        <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.8s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <g transform="skewX(-16)">
        <circle cx="38" cy="50" r="2">
          <animate attributeName="opacity" values="0;1;0.2;0" keyTimes="0;0.15;0.45;1" dur="1.9s" begin="0.3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="36.160" cy="7.680" r="1.5">
          <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
        </circle>
        <circle cx="43.520" cy="88.640" r="1.5">
          <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="82.160" cy="12.280" r="1.5">
          <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="87.680" cy="90.480" r="1.5">
          <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.0s" begin="1.8s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>
</svg>
