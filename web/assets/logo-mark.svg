<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1c20"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>

    <filter id="frostBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <filter id="frostBlurThin" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <!-- Bloom de los destellos: blur + la forma nítida encima. -->
    <filter id="glint" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="tileClip">
      <rect x="4" y="4" width="92" height="92" rx="20"/>
    </clipPath>

    <!-- La "K" es la grieta de un vidrio roto: 4 cortes rectos desde un
         punto de impacto central (38,50), inclinados con skewX, en un único
         <path> que pasa por el centro varias veces (en vez de 4 subpaths
         sueltos) para que los 4 brazos se fundan en una sola silueta en el
         vértice, sin dejar una cuña sin cubrir ahí. stroke-linejoin="round"
         + stroke-linecap="butt": puntas planas, vértice fundido sin picos.
         Las 4 puntas terminan bien adentro del tile (mismos puntos que los
         destellos de punta, más abajo) — nunca tocan tileClip: si el corte
         llegara al borde, el clip le cortaría el bisel (el halo blureado)
         a mitad de camino en vez de dejarlo apagarse solo. -->
    <mask id="plateMask">
      <rect x="4" y="4" width="92" height="92" rx="20" fill="white"/>
      <g transform="skewX(-16)">
        <path
          d="M36.3 10.9 L38 50 L43.1 85.7 L38 50 L78.8 15.15 L38 50 L83.9 87.4"
          fill="none" stroke="black" stroke-width="8" stroke-linecap="butt" stroke-linejoin="round"
        />
      </g>
    </mask>
  </defs>

  <g clip-path="url(#tileClip)">
    <!-- Placa de vidrio: la K es un agujero transparente recortado con
         plateMask, sin relleno ni efecto propio — el hueco en sí no "hace"
         nada, es la ausencia de placa. -->
    <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#tileGrad)" mask="url(#plateMask)"/>

    <!-- Bisel esmerilado: nace de los contornos de la placa (su borde
         exterior y los dos filos de cada corte de la K), nunca del medio
         del hueco. Cada filo es un trazo paralelo al corte, corrido hacia
         afuera desde el vértice (no pasa por el punto de impacto: ahí las
         8 líneas —2 filos × 4 rayos— se cruzaban y ensuciaban el centro),
         más un único aro circular en el vértice para el bisel de esa zona
         redondeada donde se funden los 4 brazos. -->
    <g fill="none" stroke="#ffffff">
      <rect x="4" y="4" width="92" height="92" rx="20" stroke-width="3" stroke-opacity="0.3" filter="url(#frostBlur)"/>
      <rect x="4" y="4" width="92" height="92" rx="20" stroke-width="1" stroke-opacity="0.55"/>
      <g transform="skewX(-16)" stroke-linecap="butt">
        <g filter="url(#frostBlurThin)" stroke-width="1.6" stroke-opacity="0.3">
          <path d="M40.74 43.88 L39.297 10.77"/>
          <path d="M34.74 44.14 L33.303 11.03"/>
          <path d="M35.88 56.36 L40.13 86.124"/>
          <path d="M41.82 55.52 L46.07 85.276"/>
          <path d="M44.51 48.39 L80.747 17.43"/>
          <path d="M40.61 43.83 L76.853 12.87"/>
          <path d="M40.755 56.116 L82.005 89.726"/>
          <path d="M44.545 51.464 L85.795 85.074"/>
          <circle cx="38" cy="50" r="4"/>
        </g>
        <g stroke-width="0.7" stroke-opacity="0.55">
          <path d="M40.74 43.88 L39.297 10.77"/>
          <path d="M34.74 44.14 L33.303 11.03"/>
          <path d="M35.88 56.36 L40.13 86.124"/>
          <path d="M41.82 55.52 L46.07 85.276"/>
          <path d="M44.51 48.39 L80.747 17.43"/>
          <path d="M40.61 43.83 L76.853 12.87"/>
          <path d="M40.755 56.116 L82.005 89.726"/>
          <path d="M44.545 51.464 L85.795 85.074"/>
          <circle cx="38" cy="50" r="4"/>
        </g>
      </g>
    </g>

    <!-- Destellos: sobre esos mismos contornos (borde de la placa, punto de
         impacto y puntas de la K), parpadeo asincrónico tipo bola de disco. -->
    <g fill="#ffffff" filter="url(#glint)">
      <circle cx="50" cy="4" r="1.6">
        <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.3s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="96" cy="50" r="1.6">
        <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="50" cy="96" r="1.6">
        <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.1s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="4" cy="50" r="1.6">
        <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.8s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <g transform="skewX(-16)">
        <circle cx="38" cy="50" r="2">
          <animate attributeName="opacity" values="0;1;0.2;0" keyTimes="0;0.15;0.45;1" dur="1.9s" begin="0.3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="36.3" cy="10.9" r="1.5">
          <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
        </circle>
        <circle cx="43.1" cy="85.7" r="1.5">
          <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="78.8" cy="15.15" r="1.5">
          <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="83.9" cy="87.4" r="1.5">
          <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.2;0.5;1" dur="2.0s" begin="1.8s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>
</svg>
